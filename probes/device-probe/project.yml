# xcodegen spec for the throwaway device probe.
#
# On the Mac:
#   brew install xcodegen        # once
#   cd probes/device-probe
#   xcodegen generate            # writes DeviceProbe.xcodeproj (git-ignored, regenerable)
#   open DeviceProbe.xcodeproj   # or let XcodeBuildMCP build it headless
#
# The .xcodeproj is generated, never committed — the spec is the source of
# truth, which is the whole reason a hand-written pbxproj was avoided. Set your
# team in Signing & Capabilities (the free personal team is enough for a probe).
name: DeviceProbe
options:
  deploymentTarget:
    iOS: "17.0"          # matches the map's platform floor (#6)
  createIntermediateGroups: true
targets:
  DeviceProbe:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangericm.rawforge.deviceprobe
        # Xcode 26 no longer supplies a default, so without this the product
        # builds as bare ".app" and two tasks race to produce it.
        PRODUCT_NAME: "$(TARGET_NAME)"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        SWIFT_VERSION: "5.0"             # the motion sampler captures across a
                                         # queue on purpose; Swift 6 strict
                                         # concurrency would reject it
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DeviceProbe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The camera and motion probes need these; the file-sharing pair
        # surfaces saved DNGs in Finder / Files, matching the sandbox decision.
        NSCameraUsageDescription: "Device probe captures Bayer RAW."
        NSMotionUsageDescription: "Device probe records motion for stillness measurement."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
