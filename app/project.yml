# xcodegen spec for the RAWForge capture app.
#
#   brew install xcodegen        # once
#   cd app
#   xcodegen generate            # writes RAWForge.xcodeproj (git-ignored)
#   open RAWForge.xcodeproj
#
# The .xcodeproj is generated, never committed — the spec is the source of
# truth. Set your team in Signing & Capabilities.
name: RAWForge
options:
  deploymentTarget:
    iOS: "17.0"          # the platform floor settled in #6
  createIntermediateGroups: true

# Project-wide, deliberately.
#
# xcodegen supplies no `SWIFT_ACTIVE_COMPILATION_CONDITIONS` where Xcode's own
# templates do, so `#if DEBUG` compiled to nothing everywhere until it was set
# on the app target. That fix was incomplete and stayed incomplete for months:
# the *test* target never got it, so every `#if DEBUG` in a test compiled away
# too, silently. `BuildConfigurationTests` is what finally noticed.
#
# Set here rather than per target so the next target added inherits it instead
# of repeating the same bug a third time.
settings:
  base:
    # Apply this to the test bundle too. Leaving it only on the app target
    # makes Xcode fall back to its obsolete traditional header-map mode while
    # compiling tests.
    ALWAYS_SEARCH_USER_PATHS: "NO"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  RAWForge:
    build:
      targets:
        RAWForge: all
        RAWForgeTests: [test]
    test:
      targets: [RAWForgeTests]

targets:
  RAWForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RAWForgeTests
      - path: ../docs/app-store/privacy-policy.md
        buildPhase: resources
      - path: ../docs/privacy/index.md
        buildPhase: resources
    dependencies:
      - target: RAWForge
    # Xcode refuses .swift files in Copy Bundle Resources. Stage renamed,
    # byte-identical copies into the test bundle so the simulator gate reads
    # the live sources without placing them in the shipping app.
    preBuildScripts:
      - name: Stage Dynamic Type audit sources
        script: |
          set -eu
          audit_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          /bin/mkdir -p "$audit_dir"
          /bin/cp "$SRCROOT/RAWForge/UI/DeviceProfileView.swift" "$audit_dir/DeviceProfileView.swift.txt"
          /bin/cp "$SRCROOT/RAWForge/UI/LogConsoleView.swift" "$audit_dir/LogConsoleView.swift.txt"
        inputFiles:
          - "$(SRCROOT)/RAWForge/UI/DeviceProfileView.swift"
          - "$(SRCROOT)/RAWForge/UI/LogConsoleView.swift"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/DeviceProfileView.swift.txt"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LogConsoleView.swift.txt"
    settings:
      base:
        # Xcode 26 supplies no default, same as the app target — without this
        # the bundle builds as bare ".xctest" and two tasks race to produce it.
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.tangericm.rawforge.tests
        # xcodegen sets TEST_HOST from the dependency but leaves BUNDLE_LOADER
        # empty, so the bundle cannot resolve the app's symbols and fails to
        # link. Both are needed for a host-app unit test bundle.
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

  RAWForge:
    type: application
    platform: iOS
    sources:
      - path: RAWForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangericm.rawforge
        # Xcode 26 supplies no default; without this the product builds as a
        # bare ".app" and two tasks race to produce it.
        PRODUCT_NAME: "$(TARGET_NAME)"
        # Named explicitly so `@testable import RAWForge` resolves — the module
        # name otherwise follows PRODUCT_NAME, which was empty here once already.
        PRODUCT_MODULE_NAME: RAWForge
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        SWIFT_VERSION: "5.0"             # AVFoundation delegate callbacks land
                                         # off the main actor; Swift 6 strict
                                         # concurrency would reject the rig
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        # Generated by tools/make-icon.py rather than committed as an opaque
        # blob — the mark is the Bayer quad the app exists to capture.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # `@testable import RAWForge` is needed by the simulator suite, never by
        # a distributable build.
        Debug:
          ENABLE_TESTABILITY: "YES"
    preBuildScripts: []
    postBuildScripts:
        # Invoked through bash rather than executed directly: this repo has
        # core.fileMode = false, so git never records the executable bit and a
        # fresh clone — or a CI runner — would get "Permission denied".
      - script: "bash \"$SRCROOT/tools/stamp-build.sh\""
        name: Stamp build number and commit
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RAWForge
        # Placeholder: the build phase stamps the real value into the built
        # product. Committing a number here would mean every build dirtied the
        # working tree.
        CFBundleVersion: "1"
        RAWForgeCommit: unknown
        # No encryption beyond what the OS provides. Without this, every single
        # submission stops to ask the same question.
        ITSAppUsesNonExemptEncryption: false
        # Launch on the same near-black the app runs on. The default follows the
        # system appearance, so a phone in light mode flashed white before the
        # viewfinder appeared.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Camera and nothing else (#11 — no photo library, no cloud). The
        # file-sharing pair is what lets a session directory be dragged out
        # of Files or off a cable.
        NSCameraUsageDescription: "RAWForge uses the camera to preview your scene and save the RAW captures you choose to make."
        NSMotionUsageDescription: "RAWForge records device motion during a capture so each RAW frame includes evidence of how steadily the phone was held."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
